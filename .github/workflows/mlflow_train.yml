name: MLflow Model Training CI

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**' # 1. Trigger action jika ada perubahan di dalam folder MLProject
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    
    # 2. Sangat Penting: Memaksa semua perintah 'run' berjalan di dalam folder MLProject
    defaults:
      run:
        working-directory: ./MLProject

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'
        cache: 'pip'
        cache-dependency-path: './MLProject/requirements.txt' # 3. Memberitahu lokasi file requirements
        
    - name: Install Dependencies
      run: |
        # Menggunakan requirements.txt yang ada di folder kamu agar lebih rapi
        pip install -r requirements.txt
        
    - name: Train Model & Log to DagsHub
      env:
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      run: |
        # Menjalankan script (Bot sudah berada di dalam folder MLProject)
        python modelling.py
        
    - name: Upload temporary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-and-plots
        path: |
          MLProject/**/*.pkl
          MLProject/**/*.png
        retention-days: 14
        
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: model-v${{ github.run_number }}
        name: Model Training Run #${{ github.run_number }}
        files: |
          MLProject/**/*.pkl
          MLProject/**/*.png
        generate_release_notes: true
